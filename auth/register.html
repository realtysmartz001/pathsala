    <!-- ══════════════════════════════════════════════
         Register-page UI-only enhancements.
         These do NOT touch form submission, validation
         logic, or any existing behaviour — the form still
         posts normally to register.php exactly as before.
    ══════════════════════════════════════════════ -->
    <script>
        (function () {
            // ── Password show/hide toggle ──
            document.querySelectorAll('.pw-toggle-btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var targetId = btn.getAttribute('data-target');
                    var input = document.getElementById(targetId);
                    var icon = btn.querySelector('i');
                    if (!input) return;
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.remove('bi-eye');
                        icon.classList.add('bi-eye-slash');
                    } else {
                        input.type = 'password';
                        icon.classList.remove('bi-eye-slash');
                        icon.classList.add('bi-eye');
                    }
                });
            });

            // ── Icon highlight while a field has a value ──
            document.querySelectorAll('.register-form .form-input input[type="text"], .register-form .form-input input[type="email"], .register-form .form-input input[type="password"]').forEach(function (input) {
                input.addEventListener('input', function () {
                    var wrap = input.closest('.form-input');
                    if (!wrap) return;
                    if (input.value.length > 0) wrap.classList.add('has-value');
                    else wrap.classList.remove('has-value');
                });
            });

            // ── Job Role select highlight (same has-value pattern as text inputs) ──
            // ── Others → show/require custom job role field ──
            // Bound via jQuery (not vanilla addEventListener) because Nice Select
            // fires its change event through jQuery's .trigger('change'), which a
            // plain addEventListener('change', ...) listener can miss.
            var jobRoleSelect = document.getElementById('job_role');
            var customJobRoleWrap = document.getElementById('customJobRoleWrap');
            var customJobRoleInput = document.getElementById('custom_job_role');
            if (window.jQuery && jobRoleSelect) {
                jQuery('#job_role').on('change', function () {
                    var wrap = jobRoleSelect.closest('.form-input');
                    if (wrap) {
                        if (jobRoleSelect.value.length > 0) wrap.classList.add('has-value');
                        else wrap.classList.remove('has-value');
                    }
                    if (customJobRoleWrap && customJobRoleInput) {
                        if (jobRoleSelect.value === 'others') {
                            customJobRoleWrap.style.display = '';
                            customJobRoleInput.required = true;
                        } else {
                            customJobRoleWrap.style.display = 'none';
                            customJobRoleInput.required = false;
                            customJobRoleInput.value = '';
                        }
                    }
                });
            } else if (jobRoleSelect) {
                // Fallback if jQuery isn't loaded for some reason — keeps old behavior
                jobRoleSelect.addEventListener('change', function () {
                    var wrap = jobRoleSelect.closest('.form-input');
                    if (wrap) {
                        if (jobRoleSelect.value.length > 0) wrap.classList.add('has-value');
                        else wrap.classList.remove('has-value');
                    }
                    if (customJobRoleWrap && customJobRoleInput) {
                        if (jobRoleSelect.value === 'others') {
                            customJobRoleWrap.style.display = '';
                            customJobRoleInput.required = true;
                        } else {
                            customJobRoleWrap.style.display = 'none';
                            customJobRoleInput.required = false;
                            customJobRoleInput.value = '';
                        }
                    }
                });
            }

            // ── Password strength meter (visual guidance only) ──
            var pwInput = document.getElementById('password');
            var bars = document.querySelectorAll('#pwStrength .pw-strength-bar');
            var label = document.getElementById('pwStrengthLabel');
            var barColors = ['#f87171', '#facc15', '#60a5fa', '#34d399'];
            var barLabels = ['Weak', 'Fair', 'Good', 'Strong'];

            function scorePassword(pw) {
                var score = 0;
                if (pw.length >= 6) score++;
                if (pw.length >= 10) score++;
                if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
                if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;
                return Math.min(score, 4);
            }

            if (pwInput) {
                pwInput.addEventListener('input', function () {
                    var pw = pwInput.value;
                    var score = pw.length === 0 ? 0 : scorePassword(pw) || 1;

                    bars.forEach(function (bar, i) {
                        if (pw.length === 0) {
                            bar.style.background = 'var(--card-border)';
                        } else {
                            bar.style.background = (i < score) ? barColors[score - 1] : 'var(--card-border)';
                        }
                    });

                    label.textContent = pw.length === 0 ? '' : barLabels[score - 1];
                    label.style.color = pw.length === 0 ? 'var(--text-dim)' : barColors[score - 1];

                    checkPasswordMatch();
                });
            }

            // ── Confirm password match indicator (visual only, does not block submit) ──
            var confirmInput = document.getElementById('confirm_password');
            var matchHint = document.getElementById('pwMatchHint');

            function checkPasswordMatch() {
                if (!confirmInput || !pwInput || !matchHint) return;
                var pw = pwInput.value;
                var cpw = confirmInput.value;

                if (cpw.length === 0) {
                    matchHint.textContent = '';
                    matchHint.className = 'pw-match-hint';
                    return;
                }
                if (pw === cpw) {
                    matchHint.innerHTML = '<i class="bi bi-check-circle-fill"></i> Passwords match';
                    matchHint.className = 'pw-match-hint match';
                } else {
                    matchHint.innerHTML = '<i class="bi bi-x-circle-fill"></i> Passwords do not match';
                    matchHint.className = 'pw-match-hint mismatch';
                }
            }
            if (confirmInput) {
                confirmInput.addEventListener('input', checkPasswordMatch);
            }

            // ── Submit button loading state ──
            // Purely visual — the form still submits normally via its
            // existing action/method, nothing here prevents submission.
            var form = document.getElementById('registerForm');
            var submitBtn = document.getElementById('registerSubmitBtn');
            var submitWrap = submitBtn ? submitBtn.closest('.submit-wrap') : null;
            if (form && submitBtn) {
                form.addEventListener('submit', function () {
                    submitBtn.classList.add('is-loading');
                    submitBtn.value = 'Registering...';
                    if (submitWrap) submitWrap.classList.add('is-loading');
                });
            }
        })();
    </script>

</body>

</html>
